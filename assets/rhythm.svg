<svg xmlns="http://www.w3.org/2000/svg" width="700" height="168" viewBox="0 0 700 168" role="img" aria-label="Histogram of 4,349 open-source commits by hour of day, Asia/Shanghai, axis running 04:00 through 03:00 so the night block stays contiguous. Values by hour from 04:00: 0, 0, 0, 11, 44, 232, 338, 319, 186, 184, 265, 285, 262, 292, 242, 206, 214, 348, 460, 329, 91, 36, 3, 2. 04:00 to 06:59 are exactly zero, drawn as open slots below the axis. Peak 22:00 with 460 commits, 10.6 percent of all commits, 2.54 times a flat baseline. Bars below the 2.5-pixel minimum height are drawn at that minimum.">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .tm{text-anchor:middle}.te{text-anchor:end}.ts{text-anchor:start}
  .bg{fill:#ffffff}.ink{fill:#1f2328}.lbl{fill:#6e7781}.val{fill:#57606a}.bar{fill:#8c959f}.acc{fill:#0969da}.accv{fill:#0969da;font-weight:600}.zero{fill:none;stroke:#8c959f;stroke-width:1.2}.rule{stroke:#d1d9e0}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.ink{fill:#f0f6fc}.lbl{fill:#9198a1}.val{fill:#8b949e}.bar{fill:#6e7681}.acc{fill:#58a6ff}.accv{fill:#58a6ff;font-weight:600}.zero{stroke:#6e7681}.rule{stroke:#30363d}
  }

  .sweep{fill:#0969da;opacity:0}
  @media (prefers-color-scheme:dark){.sweep{fill:#58a6ff}}
  @media (prefers-reduced-motion:no-preference){
    .sweep{animation:swr 2.1s cubic-bezier(.22,1,.36,1) .6s 1 both}
    @keyframes swr{0%{opacity:0;transform:translateX(0)}
      12%{opacity:.7}68%{opacity:.7;transform:translateX(496.4px)}
      100%{opacity:0;transform:translateX(496.4px)}}
  }
</style>
