<svg xmlns="http://www.w3.org/2000/svg" width="700" height="196" viewBox="0 0 700 196" role="img" aria-label="Slope chart of language byte shares over the source repositories under two conditions. Left, as GitHub&#x27;s language endpoint reports it: HTML 67.8 percent, Python 22.7 percent, TypeScript 8.3 percent, Swift 0.5 percent, CSS 0.2 percent, C# 0.2 percent. Right, excluding threefish-ai.github.io, whose bytes of HTML are generated static-site output rather than authored source: Python 69.1 percent, TypeScript 25.2 percent, HTML 2.3 percent, Swift 1.4 percent, C# 0.6 percent, CSS 0.5 percent. HTML falls from rank one to rank three; Python rises to rank one. Byte counts measure committed source size, not authorship or effort, and include vendored files. Every source repo contributes counted bytes. Data: GitHub.">
<style>
