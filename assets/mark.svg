<svg xmlns="http://www.w3.org/2000/svg" width="256" height="62" viewBox="0 0 256 62" role="img" aria-label="Three fish, drawn as a signature mark. In Mandarin the three surpluses of Dong Yu — winter, night, and rainy days (三余, sān yú) — sound nearly the same as three fish (三鱼). Hence the handle ThreeFish. Purely decorative; no data encoded.">
<style>
  .fi{fill:none;stroke:#6e7781;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .eye{fill:#6e7781}
  @media (prefers-color-scheme:dark){.fi{stroke:#9198a1}.eye{fill:#9198a1}}
  .rip{fill:none;stroke:#0969da;stroke-width:1.2;opacity:0;transform-box:fill-box;transform-origin:center}
  @media (prefers-color-scheme:dark){.rip{stroke:#58a6ff}}
  @media (prefers-reduced-motion:no-preference){
    .rip{animation:rip 2s ease-out 1 both;animation-delay:var(--d)}
    @keyframes rip{0%{opacity:0;transform:scale(.45)}
      45%{opacity:.5}100%{opacity:0;transform:scale(1.35)}}
  }
</style>
<ellipse class="rip" style="--d:.3s" cx="46" cy="34" rx="28" ry="12"/>
<ellipse class="rip" style="--d:.85s" cx="132" cy="26" rx="28" ry="12"/>
