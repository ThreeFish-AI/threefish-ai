<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180" role="img" aria-label="Timeline ribbon, one row per source repository from creation to last push, 2024-06-22 to 2026-09-01. agentic-ai-cognizes created 2025-10-22, last push 2026-05-18, archived (graduated); coding-proxy created 2026-03-30, last push 2026-08-27, active; give-me-a-break created 2026-06-23, last push 2026-09-04, active; hyper-git created 2026-06-27, last push 2026-09-01, active; negentropy created 2026-01-31, last push 2026-09-04, active; negentropy-perceives created 2025-08-26, last push 2026-05-18, archived (graduated); threefish-ai.github.io created 2024-06-22, last push 2026-07-08, active. Bar ends mark last push — the closest public proxy for archival, because GitHub exposes no archive timestamp; archived-ness rides the square terminal glyph instead. Repositories deleted before today are invisible at public caliber. Data: GitHub.">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .tm{text-anchor:middle}.te{text-anchor:end}.ts{text-anchor:start}
  .bg{fill:#ffffff}.ink{fill:#1f2328}.lbl{fill:#6e7781}.val{fill:#57606a}.bar{fill:#8c959f}.acc{fill:#0969da}.accv{fill:#0969da;font-weight:600}.zero{fill:none;stroke:#8c959f;stroke-width:1.2}.rule{stroke:#d1d9e0}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.ink{fill:#f0f6fc}.lbl{fill:#9198a1}.val{fill:#8b949e}.bar{fill:#6e7681}.acc{fill:#58a6ff}.accv{fill:#58a6ff;font-weight:600}.zero{stroke:#6e7681}.rule{stroke:#30363d}
  }

  .sweep{fill:#0969da;opacity:0}
  @media (prefers-color-scheme:dark){.sweep{fill:#58a6ff}}
  @media (prefers-reduced-motion:no-preference){
    .sweep{animation:swy 1.8s cubic-bezier(.22,1,.36,1) .3s 1 both}
    @keyframes swy{0%{opacity:0;transform:translateY(0)}
      12%{opacity:.6}72%{opacity:.6;transform:translateY(132px)}
      100%{opacity:0;transform:translateY(132px)}}
  }
</style>
