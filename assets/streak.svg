<svg xmlns="http://www.w3.org/2000/svg" width="700" height="164" viewBox="0 0 700 164" role="img" aria-label="Rug plot, one tick per day over the latest 400 days, 2025-07-29 to 2026-09-01; tick height is the square root of that day&#x27;s authored-commit count. 208 days carry at least one commit (52 percent); the 192 empty ones are drawn as a thin rule below the axis, one segment per gap. The longest unbroken run inside this window is 88 days, 2026-03-19 to 2026-06-14, marked with a bracket. Counted over authored commits in source repositories — the same population as every other commit figure here, and narrower than the GitHub contributions calendar, which also counts private work, issues and reviews. Data: GitHub.">
