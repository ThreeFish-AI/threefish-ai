  }

  .tick{stroke:#8c959f;fill:none;stroke-width:1.4}
  @media (prefers-color-scheme:dark){.tick{stroke:#6e7681}}
  .sweep{fill:#0969da;opacity:0}
  @media (prefers-color-scheme:dark){.sweep{fill:#58a6ff}}
  @media (prefers-reduced-motion:no-preference){
    .sweep{animation:sbs 1.8s cubic-bezier(.22,1,.36,1) .5s 1 both}
