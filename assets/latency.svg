<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200" role="img" aria-label="Histogram of merged pull-request lifetime in negentropy with a step cumulative curve on a right-hand zero-to-hundred-percent axis. 1078 merged pull requests, log-spaced buckets: &lt;1m 281, 1-2 72, 2-5 144, 5-15 225, 15-60m 177, 1-4h 92, 4-24h 83, &gt;24h 4. Median 6 min; 90th percentile 2.8 h; 83 percent merge within an hour; the longest waited 11.9 d. 40 further closed pull requests were never merged and are excluded. This is a solo self-merge repository: the lifetime measures how small a change unit is, not how fast a review is. Data: GitHub.">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .tm{text-anchor:middle}.te{text-anchor:end}.ts{text-anchor:start}
  .bg{fill:#ffffff}.ink{fill:#1f2328}.lbl{fill:#6e7781}.val{fill:#57606a}.bar{fill:#8c959f}.acc{fill:#0969da}.accv{fill:#0969da;font-weight:600}.bars{fill:none;stroke:#8c959f}.accs{fill:none;stroke:#0969da}.inks{fill:none;stroke:#1f2328}.vals{fill:none;stroke:#57606a}.zero{fill:none;stroke:#8c959f;stroke-width:1.2}.rule{stroke:#d1d9e0}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.ink{fill:#f0f6fc}.lbl{fill:#9198a1}.val{fill:#8b949e}.bar{fill:#6e7681}.acc{fill:#58a6ff}.accv{fill:#58a6ff;font-weight:600}.bars{stroke:#6e7681}.accs{stroke:#58a6ff}.inks{stroke:#f0f6fc}.vals{stroke:#8b949e}.zero{stroke:#6e7681}.rule{stroke:#30363d}
  }

  .ring{fill:none;stroke:#0969da;stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center}
  @media (prefers-color-scheme:dark){.ring{stroke:#58a6ff}}
  @media (prefers-reduced-motion:no-preference){
    .ring{animation:lnr 1.5s cubic-bezier(.22,1,.36,1) .8s 1 both}
    @keyframes lnr{0%{opacity:0;transform:scale(1.9)}
      30%{opacity:.85}100%{opacity:0;transform:scale(1)}}
  }
</style>
