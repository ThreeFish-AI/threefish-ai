<svg xmlns="http://www.w3.org/2000/svg" width="700" height="122" viewBox="0 0 700 122" role="img" aria-label="synthetic aria">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .tm{text-anchor:middle}.te{text-anchor:end}.ts{text-anchor:start}
  .bg{fill:#ffffff}.ink{fill:#1f2328}.lbl{fill:#6e7781}.val{fill:#57606a}.bar{fill:#8c959f}.acc{fill:#0969da}.accv{fill:#0969da;font-weight:600}.bars{fill:none;stroke:#8c959f}.accs{fill:none;stroke:#0969da}.inks{fill:none;stroke:#1f2328}.vals{fill:none;stroke:#57606a}.zero{fill:none;stroke:#8c959f;stroke-width:1.2}.rule{stroke:#d1d9e0}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.ink{fill:#f0f6fc}.lbl{fill:#9198a1}.val{fill:#8b949e}.bar{fill:#6e7681}.acc{fill:#58a6ff}.accv{fill:#58a6ff;font-weight:600}.bars{stroke:#6e7681}.accs{stroke:#58a6ff}.inks{stroke:#f0f6fc}.vals{stroke:#8b949e}.zero{stroke:#6e7681}.rule{stroke:#30363d}
  }

  .sweep{fill:#0969da;opacity:0}
  @media (prefers-color-scheme:dark){.sweep{fill:#58a6ff}}
  @media (prefers-reduced-motion:no-preference){
    .sweep{animation:swy 1.8s cubic-bezier(.22,1,.36,1) .3s 1 both}
    @keyframes swy{0%{opacity:0;transform:translateY(0)}
      12%{opacity:.6}72%{opacity:.6;transform:translateY(50px)}
      100%{opacity:0;transform:translateY(50px)}}
  }
</style>
<rect class="bg" width="700" height="122" rx="6"/>
<line class="bars" x1="132.0" y1="52" x2="629.2" y2="52" stroke-width="4" stroke-linecap="round"/>
<rect class="ink" x="625.7" y="48.5" width="7" height="7"/>
<text x="126" y="55.0" font-size="9.5" class="lbl te">old-wing</text>
<text x="136.0" y="47.0" font-size="8.5" class="lbl ts">2025-06 → 2026-02</text>
<line class="accs" x1="566.3" y1="70" x2="686.0" y2="70" stroke-width="4" stroke-linecap="round"/>
<text x="126" y="73.0" font-size="9.5" class="lbl te">negentropy</text>
<text x="570.3" y="65.0" font-size="8.5" class="lbl ts">2026-01 → 2026-03</text>
<rect class="sweep" x="42" y="30" width="644" height="2.2" rx="1.1"/>
<text x="132" y="90" font-size="10" class="lbl tm">2025-06</text>
<text x="256" y="90" font-size="10" class="lbl tm">2025-08</text>
<text x="380" y="90" font-size="10" class="lbl tm">2025-10</text>
<text x="503" y="90" font-size="10" class="lbl tm">2025-12</text>
<text x="629" y="90" font-size="10" class="lbl tm">2026-02</text>
<text x="42" y="20" font-size="11" class="lbl ts">repository lifespans, creation to last push · ends are last push, not archive dates</text>
<text x="42" y="34" font-size="9.5" class="lbl ts">■ graduated (archived) · bars in blue are live · deleted repos are invisible at public caliber</text>
<text x="686" y="114" font-size="9.5" class="lbl te">as of 2026-09-05</text>
</svg>
