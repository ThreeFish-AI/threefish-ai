<svg xmlns="http://www.w3.org/2000/svg" width="700" height="134" viewBox="0 0 700 134" role="img" aria-label="synthetic aria">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .tm{text-anchor:middle}.te{text-anchor:end}.ts{text-anchor:start}
  .bg{fill:#ffffff}.ink{fill:#1f2328}.lbl{fill:#6e7781}.val{fill:#57606a}.bar{fill:#8c959f}.acc{fill:#0969da}.accv{fill:#0969da;font-weight:600}.bars{fill:none;stroke:#8c959f}.accs{fill:none;stroke:#0969da}.inks{fill:none;stroke:#1f2328}.vals{fill:none;stroke:#57606a}.zero{fill:none;stroke:#8c959f;stroke-width:1.2}.rule{stroke:#d1d9e0}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.ink{fill:#f0f6fc}.lbl{fill:#9198a1}.val{fill:#8b949e}.bar{fill:#6e7681}.acc{fill:#58a6ff}.accv{fill:#58a6ff;font-weight:600}.bars{stroke:#6e7681}.accs{stroke:#58a6ff}.inks{stroke:#f0f6fc}.vals{stroke:#8b949e}.zero{stroke:#6e7681}.rule{stroke:#30363d}
  }

  .sweep{fill:#0969da;opacity:0}
  @media (prefers-color-scheme:dark){.sweep{fill:#58a6ff}}
  @media (prefers-reduced-motion:no-preference){
    .sweep{animation:csw 1.8s cubic-bezier(.22,1,.36,1) .5s 1 both}
    @keyframes csw{0%{opacity:0;transform:translateY(0)}
      12%{opacity:.6}72%{opacity:.6;transform:translateY(62px)}
      100%{opacity:0;transform:translateY(62px)}}
  }
</style>
<rect class="bg" width="700" height="134" rx="6"/>
<line class="rule" x1="152" y1="46" x2="686" y2="46" stroke-width="1"/>
<circle class="bar" cx="297.6" cy="41.0" r="3.4"/>
<circle class="zero" cx="540.4" cy="46.0" r="3.4"/>
<text x="300.6" y="61.0" font-size="8.5" class="lbl ts">v0.1.0</text>
<text x="537.4" y="61.0" font-size="8.5" class="lbl te">v0.2.0</text>
<text x="146" y="49.0" font-size="9.5" class="lbl te">coding-proxy · 2</text>
<line class="rule" x1="152" y1="70" x2="686" y2="70" stroke-width="1"/>
<circle class="acc" cx="414.1" cy="65.0" r="3.4"/>
<text x="417.1" y="85.0" font-size="8.5" class="lbl ts">v0.0.1</text>
<text x="146" y="73.0" font-size="9.5" class="lbl te">negentropy · 1</text>
<rect class="sweep" x="42" y="30" width="644" height="2.2" rx="1.1"/>
<text x="677" y="102" font-size="10" class="lbl tm">2026-03</text>
<text x="42" y="20" font-size="11" class="lbl ts">releases on the commit timeline · hollow = pre-release · counts at left</text>
<text x="42" y="34" font-size="9.5" class="lbl ts">negentropy ships as merged PRs, not tags — it is a deployed service, not a distributed package</text>
<text x="686" y="126" font-size="9.5" class="lbl te">as of 2026-09-05</text>
</svg>
